<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Football Betting Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .user-info {
            text-align: center;
        }
        
        .balance {
            font-size: 2rem;
            font-weight: bold;
            color: #27ae60;
            margin: 10px 0;
        }
        
        .matches-grid {
            display: grid;
            gap: 15px;
        }
        
        .match-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            transition: all 0.3s ease;
        }
        
        .match-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        
        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .team {
            text-align: center;
            flex: 1;
        }
        
        .vs {
            font-weight: bold;
            color: #666;
            margin: 0 20px;
        }
        
        .bet-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-success {
            background: #27ae60;
            color: white;
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .history-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
        
        .won {
            color: #27ae60;
        }
        
        .lost {
            color: #e74c3c;
        }
        
        .pending {
            color: #f39c12;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚽ Football Betting Platform</h1>
            <p>Bet on your favorite teams and win big!</p>
        </div>

        <div class="dashboard">
            <!-- User Info Panel -->
            <div class="card user-info">
                <h3>👤 Your Account</h3>
                <div class="balance" id="userBalance">$0.00</div>
                <p>Total Winnings: <span id="totalWinnings">$0.00</span></p>
                <button class="btn btn-primary" onclick="showDepositModal()">💳 Deposit</button>
                <button class="btn btn-primary" onclick="loadUserBets()">📊 My Bets</button>
            </div>

            <!-- Matches Panel -->
            <div class="card">
                <h3>⚽ Live Matches</h3>
                <div class="matches-grid" id="matchesContainer">
                    <!-- Matches will be loaded here -->
                </div>
            </div>

            <!-- Betting History -->
            <div class="card">
                <h3>📈 Recent Activity</h3>
                <div id="bettingHistory">
                    <!-- Betting history will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Admin Panel (Visible only to admin) -->
        <div class="card" id="adminPanel" style="display: none;">
            <h3>👨‍💼 Admin Panel</h3>
            <button class="btn btn-primary" onclick="showAddMatchModal()">➕ Add Match</button>
            <button class="btn btn-success" onclick="showSetResultModal()">🎯 Set Result</button>
        </div>
    </div>

    <!-- Deposit Modal -->
    <div class="modal" id="depositModal">
        <div class="modal-content">
            <h3>💳 Deposit Funds</h3>
            <div class="form-group">
                <label>Amount ($):</label>
                <input type="number" id="depositAmount" min="1" value="10">
            </div>
            <div class="bet-buttons">
                <button class="btn btn-success" onclick="processDeposit()">Deposit</button>
                <button class="btn btn-danger" onclick="closeModal('depositModal')">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Add Match Modal -->
    <div class="modal" id="addMatchModal">
        <div class="modal-content">
            <h3>➕ Add New Match</h3>
            <div class="form-group">
                <label>Team A:</label>
                <input type="text" id="teamA" placeholder="e.g., Manchester United">
            </div>
            <div class="form-group">
                <label>Team B:</label>
                <input type="text" id="teamB" placeholder="e.g., Liverpool">
            </div>
            <div class="bet-buttons">
                <button class="btn btn-success" onclick="addMatch()">Add Match</button>
                <button class="btn btn-danger" onclick="closeModal('addMatchModal')">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        const STAKE_AMOUNT = 0.5;

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            loadUserData();
            loadMatches();
            loadBettingHistory();
        });

        // API functions
        async function apiCall(endpoint, data = {}) {
            try {
                const response = await fetch(`http://localhost:8080${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                alert('Server error. Please try again.');
            }
        }

        // User management
        async function loadUserData() {
            const data = await apiCall('/user/data');
            if (data.success) {
                currentUser = data.user;
                document.getElementById('userBalance').textContent = `$${data.user.balance.toFixed(2)}`;
                document.getElementById('totalWinnings').textContent = `$${data.user.total_winnings.toFixed(2)}`;
                
                if (data.user.is_admin) {
                    document.getElementById('adminPanel').style.display = 'block';
                }
            }
        }

        async function processDeposit() {
            const amount = parseFloat(document.getElementById('depositAmount').value);
            if (amount < 1) {
                alert('Minimum deposit is $1');
                return;
            }

            const result = await apiCall('/user/deposit', { amount });
            if (result.success) {
                alert(`Successfully deposited $${amount.toFixed(2)}!`);
                closeModal('depositModal');
                loadUserData();
            }
        }

        // Match management
        async function loadMatches() {
            const data = await apiCall('/matches/list');
            if (data.success) {
                const container = document.getElementById('matchesContainer');
                container.innerHTML = '';
                
                data.matches.forEach(match => {
                    const matchCard = document.createElement('div');
                    matchCard.className = 'match-card';
                    matchCard.innerHTML = `
                        <div class="teams">
                            <div class="team">
                                <h4>${match.team_a}</h4>
                            </div>
                            <div class="vs">VS</div>
                            <div class="team">
                                <h4>${match.team_b}</h4>
                            </div>
                        </div>
                        <div class="bet-buttons">
                            <button class="btn btn-success" onclick="placeBet(${match.match_id}, 'team_a')">
                                ${match.team_a} Win
                            </button>
                            <button class="btn btn-primary" onclick="placeBet(${match.match_id}, 'draw')">
                                Draw
                            </button>
                            <button class="btn btn-danger" onclick="placeBet(${match.match_id}, 'team_b')">
                                ${match.team_b} Win
                            </button>
                        </div>
                    `;
                    container.appendChild(matchCard);
                });
            }
        }

        async function placeBet(matchId, prediction) {
            if (currentUser.balance < STAKE_AMOUNT) {
                alert(`Insufficient balance! You need $${STAKE_AMOUNT} to place a bet.`);
                return;
            }

            if (!confirm(`Place bet of $${STAKE_AMOUNT}?`)) return;

            const result = await apiCall('/bets/place', {
                match_id: matchId,
                prediction: prediction,
                stake: STAKE_AMOUNT
            });

            if (result.success) {
                alert('Bet placed successfully!');
                loadUserData();
                loadBettingHistory();
            } else {
                alert(result.message || 'Failed to place bet.');
            }
        }

        async function addMatch() {
            const teamA = document.getElementById('teamA').value;
            const teamB = document.getElementById('teamB').value;

            if (!teamA || !teamB) {
                alert('Please enter both team names');
                return;
            }

            const result = await apiCall('/admin/add_match', {
                team_a: teamA,
                team_b: teamB
            });

            if (result.success) {
                alert('Match added successfully!');
                closeModal('addMatchModal');
                loadMatches();
            }
        }

        // Betting history
        async function loadBettingHistory() {
            const data = await apiCall('/bets/history');
            if (data.success) {
                const container = document.getElementById('bettingHistory');
                container.innerHTML = '';
                
                data.bets.slice(0, 5).forEach(bet => {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    
                    let statusClass = 'pending';
                    let statusText = 'Pending';
                    
                    if (bet.status === 'won') {
                        statusClass = 'won';
                        statusText = `Won $${bet.winnings}`;
                    } else if (bet.status === 'lost') {
                        statusClass = 'lost';
                        statusText = 'Lost';
                    }
                    
                    item.innerHTML = `
                        <span>${bet.team_a} vs ${bet.team_b}</span>
                        <span class="${statusClass}">${statusText}</span>
                    `;
                    container.appendChild(item);
                });
            }
        }

        async function loadUserBets() {
            const data = await apiCall('/bets/history');
            if (data.success) {
                let message = "Your Bets:\n\n";
                data.bets.forEach(bet => {
                    message += `${bet.team_a} vs ${bet.team_b}\n`;
                    message += `Prediction: ${bet.prediction}\n`;
                    message += `Status: ${bet.status}\n`;
                    if (bet.winnings) message += `Winnings: $${bet.winnings}\n`;
                    message += "─".repeat(30) + "\n";
                });
                alert(message);
            }
        }

        // Modal functions
        function showDepositModal() {
            document.getElementById('depositModal').style.display = 'flex';
        }

        function showAddMatchModal() {
            document.getElementById('addMatchModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }
    </script>
</body>
</html>
